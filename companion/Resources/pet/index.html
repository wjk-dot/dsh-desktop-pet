<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>DeepSeek 桌宠</title>
<link rel="stylesheet" href="pet.css">
<!-- 渲染栈（与 DSH 桌面端对齐：Markdown + KaTeX + highlight.js + DOMPurify） -->
<link rel="stylesheet" href="vendor/katex.min.css">
<script src="vendor/marked.umd.js"></script>
<script src="vendor/katex.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="vendor/purify.min.js"></script>
</head>
<body>
<div class="stage" id="stage">
  <!-- 头顶会话气泡（对话记录面板） -->
  <div class="bubble" id="bubble" hidden>
    <button class="bubble-close" id="bubbleClose" title="关闭气泡">✕</button>
    <div class="transcript" id="transcript"></div>
    <div class="bubble-arrow"></div>
  </div>

  <!-- 桌宠主体：外层漂浮、内层摇摆 -->
  <div class="pet" id="pet" title="DeepSeek 桌宠">
    <div class="pet-inner">
      <img id="petIcon" src="icon.png" alt="DeepSeek" draggable="false">
      <div class="glow" id="glow"></div>
    </div>
  </div>

  <!-- 点击弹出的输入框 -->
  <div class="input-bar" id="inputBar" hidden>
    <input id="inputText" type="text" maxlength="500" placeholder="和小鲸鱼说点什么…" autocomplete="off">
    <button id="captureBtn" class="capture-btn" title="选择屏幕区域" aria-label="选择屏幕区域">⌘</button>
    <button id="pendingCaptureBtn" class="pending-capture-btn" title="已选择截图，点击移除" aria-label="移除已选择的截图" hidden>▣</button>
    <button id="sendBtn" title="发送">➤</button>
  </div>

  <div class="activity-tag" id="activityTag" hidden>
    <span id="activityText"></span>
    <button id="cancelBtn" title="停止当前任务" aria-label="停止当前任务">✕</button>
  </div>

  <!-- 离线提示 -->
  <div class="offline-tag" id="offlineTag" hidden>DeepSeek Harness 未运行</div>
</div>
<script src="pet.js"></script>
</body>
</html>
