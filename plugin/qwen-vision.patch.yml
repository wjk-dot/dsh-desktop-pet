# Optional Qwen visual MCP for DeepSeek Harness.
# Merge this entry into the active DSH profile's cordis.patch.yml, then restart DSH.
- insert:
    - id: mcp-qwen-mm-plugins-api
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: qwen-mm-plugins-api
        transport: stdio
        # Use the same stdio command on macOS and Windows. The host supplies
        # the platform PATH; env carries the private credential-file location.
        command: uvx
        args:
          - '--from'
          - 'qwen-mm-plugins[api] @ git+https://github.com/QwenLM/Qwen-MM-Plugins.git@qwen-mm-plugins-api-v1.0.3'
          - qwen-mm-plugins-api
        env:
          QWEN_MM_CONFIG: !!js require('node:path').join(process.env.DSH_HOME || require('node:path').join(require('node:os').homedir(), '.dsh'), 'pet-qwen-mm.env')
        cwd: !!js process.cwd()