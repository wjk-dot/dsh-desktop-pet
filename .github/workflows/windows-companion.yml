name: Build Windows companion

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'windows-v*'
    paths:
      - '.github/workflows/windows-companion.yml'
      - 'companion/Resources/pet/**'
      - 'companions/windows/**'
      - 'plugin/src/launch.js'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: companions/windows/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: companions/windows/src-tauri -> target
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build NSIS installer
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ..\ci-logs | Out-Null
          & cargo tauri build --bundles nsis --verbose *> ..\ci-logs\tauri-build.log
          $code = $LASTEXITCODE
          Get-Content ..\ci-logs\tauri-build.log
          exit $code
      - name: Upload installers
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekPet-Windows
          path: |
            companions/windows/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekPet-Windows-build-log
          path: companions/windows/ci-logs/tauri-build.log
          if-no-files-found: warn
      - name: Fail when packaging failed
        if: steps.build.outcome != 'success'
        shell: pwsh
        run: exit 1
