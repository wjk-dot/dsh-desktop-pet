name: Build Windows companion

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'windows-v*'
    paths:
      - '.github/workflows/windows-companion.yml'
      - 'companion/Resources/pet/**'
      - 'companions/windows/**'
      - 'plugin/src/launch.js'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: companions/windows/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: companions/windows/src-tauri -> target
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build NSIS installer
        run: cargo tauri build --bundles nsis
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekPet-Windows
          path: |
            companions/windows/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
