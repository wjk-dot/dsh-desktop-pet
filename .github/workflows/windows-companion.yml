name: Build Windows companion

on:
  workflow_dispatch:
  push:
    tags:
      - 'windows-v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: companions/windows/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: companions/windows/src-tauri -> target
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build MSI and NSIS installer
        run: cargo tauri build
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekPet-Windows
          path: |
            companions/windows/src-tauri/target/release/bundle/msi/*.msi
            companions/windows/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
